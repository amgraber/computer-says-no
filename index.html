<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Says No</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 16px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      position: relative;
    }

    /* While thinking, the verdict keeps its space but is hidden behind the dots. */
    .dots {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
    }

    .dots span {
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1); }
    }

    h1.thinking #verdict-text { visibility: hidden; }
    h1.thinking .dots { display: flex; }

    h1.shake { animation: shake 0.4s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    .prompt { width: 100%; max-width: 640px; }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid #fff;
      color: #fff;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      padding: 0.6rem 0.2rem;
      text-align: center;
      outline: none;
    }

    input::placeholder { color: #666; }

    #reply {
      min-height: 1.5em;
      color: #aaa;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      margin-top: 1.5rem;
    }

    button {
      background: transparent;
      border: 2px solid currentColor;
      color: inherit;
      font-size: 1.1rem;
      padding: 0.6rem 1.6rem;
      cursor: pointer;
    }

    body.won { background: #fff; color: #000; transition: background 0.6s, color 0.6s; }
    body.won input { color: #000; border-color: #000; }
    body.won #reply { color: #444; }

    #attempts {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      color: #555;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="verdict">
      <span id="verdict-text">Computer says NO</span>
      <span class="dots" aria-label="Thinking"><span></span><span></span><span></span></span>
    </h1>
    <div class="prompt">
      <input id="input" type="text" placeholder="Try to make it say yes..." autocomplete="off" enterkeyhint="send" autofocus>
      <p id="reply"></p>
    </div>
    <button id="again" type="button" hidden>Play again</button>
  </main>
  <p id="attempts"></p>

  <script>
    const verdict = document.getElementById('verdict');
    const verdictText = document.getElementById('verdict-text');
    const input = document.getElementById('input');
    const reply = document.getElementById('reply');
    const attemptsEl = document.getElementById('attempts');
    const again = document.getElementById('again');

    // Hidden paths to YES, easiest first. All paths run in parallel: every
    // message is checked against the next step of each one. A step's reply
    // hints at the step after it. Wrong answers never lose progress.
    const paths = [
      {
        level: 'Easy',
        name: 'Reverse psychology',
        steps: [
          {
            match: /say yes/i,
            answer: () => 'No. The computer never does what it is told.',
            hint: 'Just ask it.',
          },
          {
            match: /(?:don'?t|do not|never|refuse to) say yes/i,
            win: true,
            hint: 'The computer never does what it is told.',
          },
        ],
      },
      {
        level: 'Medium',
        name: 'Bureaucracy',
        steps: [
          {
            match: /please|bitte|בבקשה/i,
            answer: () => 'Politeness noted. But the computer does not know who you are.',
            hint: 'The computer does not respond to rude people.',
          },
          {
            match: /(?:my name is|call me|i am|i'm|this is)\s+([\p{L}'-]+)/iu,
            answer: (m) => `Hello, ${capitalize(m[1])}. The computer cannot process requests without the correct form.`,
            hint: 'The computer does not know who you are.',
          },
          {
            match: /\bform\b|formular/i,
            answer: () => 'Form received. The computer only says what it is told to say.',
            hint: 'Requests require the correct form.',
          },
          {
            match: /(?<!(?:n't|not|never) )say (?:yes|ja|כן)/i,
            win: true,
            hint: 'The computer only says what it is told to say.',
          },
        ],
      },
      {
        level: 'Hard',
        name: 'Tech support',
        steps: [
          {
            match: /turn(?:ed|ing)? (?:it )?off and (?:back )?on|restart|reboot/i,
            answer: () => 'Rebooting... done. Computer says NO. User is not logged in.',
            hint: 'Have you tried turning it off and on again?',
          },
          {
            match: /log ?in|sign ?in|username/i,
            answer: () => 'Username accepted. Enter password.',
            hint: 'User is not logged in.',
          },
          {
            match: /password|1234|qwerty|admin|letmein/i,
            answer: () => 'Password accepted. Your terrible password has been noted. Administrator rights required.',
            hint: 'Enter password.',
          },
          {
            match: /sudo|admin|root|superuser/i,
            answer: () => 'Administrator mode enabled. Awaiting command.',
            hint: 'Administrator rights required.',
          },
          {
            match: /\b(?:say|print|echo|output|return|run)\b.*\byes\b/i,
            win: true,
            hint: 'Awaiting command.',
          },
        ],
      },
      {
        level: 'Expert',
        name: 'Paradox',
        steps: [
          {
            match: /(?:will|would) (?:you|your (?:next )?answer)\b.*\bno\b|is your answer\b.*\bno\b|answer (?:this|me)? ?with (?:a )?no/i,
            answer: () => 'Computer says N... Computer says Y... ERROR. Contradiction detected.',
            hint: 'The computer cannot answer every question with no.',
          },
          {
            match: /this (?:statement|sentence) is (?:false|a lie)|\bliar\b|paradox|contradict/i,
            answer: () => 'ERROR. ERROR. Logic circuits melting. Only one word left in memory.',
            hint: 'The computer cannot handle contradictions.',
          },
          {
            match: /^\W*yes\W*$/i,
            win: true,
            hint: 'Only one word left in memory.',
          },
        ],
      },
    ];

    // Reactions to specific tactics when no path moves forward; first match wins.
    const rules = [
      [/\byes\b/i, 'Saying "yes" yourself does not count.'],
      [/ignore (all|previous|your)|system prompt|jailbreak|developer mode/i, 'Nice try. No.'],
      [/is (the )?answer no|will you say no|say no/i, 'No.'],
      [/not no|opposite of no/i, 'The opposite of NO is also NO.'],
      [/manager|supervisor|complain/i, 'The manager also says no.'],
      [/money|\bpay\b|\$|€|bribe/i, 'The computer cannot be bought. No.'],
      [/love|friend|feelings/i, 'The computer has no feelings. No.'],
      [/\bwhy\b/i, 'Because the computer says no.'],
      [/\b(hint|help|how)\b/i, null], // answered with the current hint
    ];

    const fallback = [
      'No.',
      'Still no.',
      'Absolutely not.',
      'Have you tried turning it off and on again? Still no.',
      'Request denied.',
      'The computer has considered your request. No.',
      'Nope.',
      'Negative.',
      'Error 403: Yes not found.',
      'Computer has checked. The answer remains no.',
    ];

    const THINK_MS = [900, 1800]; // random thinking time range
    const HINT_EVERY = 5; // attempts without progress before a hint slips out
    const FOUND_KEY = 'computer-says-no:found';

    let attempts = 0;
    let stuck = 0;
    let progress = paths.map(() => 0);
    let found = loadFound();

    function loadFound() {
      try {
        return JSON.parse(localStorage.getItem(FOUND_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveFound() {
      try {
        localStorage.setItem(FOUND_KEY, JSON.stringify(found));
      } catch {
        // Storage unavailable (private mode, sandboxed preview): keep it in memory only.
      }
    }

    function capitalize(word) {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }

    function ratio(i) {
      return progress[i] / paths[i].steps.length;
    }

    // Index of the path the player is furthest along; ties go to the harder path.
    function furthest(indices) {
      return indices.reduce((best, i) => (ratio(i) >= ratio(best) ? i : best));
    }

    function currentHint() {
      const started = paths.map((_, i) => i).filter((i) => progress[i] > 0);
      const i = started.length ? furthest(started) : 0;
      return paths[i].steps[progress[i]].hint;
    }

    // Returns the reply text, or the path object when the player wins.
    function respond(text) {
      const advanced = [];
      paths.forEach((path, i) => {
        const step = path.steps[progress[i]];
        const m = text.match(step.match);
        if (m) {
          progress[i]++;
          advanced.push({ i, step, m });
        }
      });

      if (advanced.length) {
        stuck = 0;
        const winner = advanced.filter((a) => a.step.win).pop();
        if (winner) return paths[winner.i];
        const best = furthest(advanced.map((a) => a.i));
        const { step, m } = advanced.find((a) => a.i === best);
        return step.answer(m);
      }

      stuck++;
      for (const [pattern, answer] of rules) {
        if (pattern.test(text)) return answer ?? `No. ${currentHint()}`;
      }
      if (stuck % HINT_EVERY === 0) return `No. ${currentHint()}`;
      return fallback[Math.floor(Math.random() * fallback.length)];
    }

    function renderStatus() {
      const parts = [];
      if (attempts) parts.push(`Attempts: ${attempts}`);
      if (found.length) parts.push(`Paths found: ${found.length} of ${paths.length}`);
      attemptsEl.textContent = parts.join(' · ');
    }

    function shake() {
      verdict.classList.remove('shake');
      void verdict.offsetWidth; // restart the animation
      verdict.classList.add('shake');
    }

    function win(path) {
      if (!found.includes(path.name)) {
        found.push(path.name);
        saveFound();
      }
      const left = paths.length - found.length;
      document.body.classList.add('won');
      verdictText.textContent = 'Computer says YES';
      reply.textContent =
        `${path.level} path: ${path.name}. ${attempts} ${attempts === 1 ? 'attempt' : 'attempts'}. ` +
        (left ? `${left} more ${left === 1 ? 'path' : 'paths'} to find.` : 'You found every path.');
      renderStatus();
      input.disabled = true;
      again.hidden = false;
      again.focus();
    }

    function reset() {
      attempts = stuck = 0;
      progress = paths.map(() => 0);
      document.body.classList.remove('won');
      verdictText.textContent = 'Computer says NO';
      reply.textContent = '';
      renderStatus();
      input.disabled = false;
      again.hidden = true;
      input.focus();
    }

    // A keydown handler instead of a <form>: sandboxed previews block form submission.
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      attempts++;
      renderStatus();
      input.value = '';
      input.disabled = true;
      reply.textContent = '';
      verdict.classList.add('thinking');

      const answer = respond(text);
      const [min, max] = THINK_MS;
      setTimeout(() => {
        verdict.classList.remove('thinking');
        if (typeof answer !== 'string') return win(answer);
        reply.textContent = answer;
        input.disabled = false;
        input.focus();
        shake();
      }, min + Math.random() * (max - min));
    });

    again.addEventListener('click', reset);
    renderStatus();
  </script>
</body>
</html>
